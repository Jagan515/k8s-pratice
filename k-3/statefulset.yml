kind: StatefulSet
apiVersion: apps/v1
metadata:
 name: nginx-statefulset
 namespace: nginx
spec:
 serviceName: nginx
 replicas: 3
 selector:
  matchLabels:
   app: nginx
 template:
  metadata:
   labels:
    app: nginx
  spec:
   containers:
   - name: nginx
     image: nginx:latest
     ports:
     - containerPort: 80
